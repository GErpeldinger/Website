---
# Production environment override
services:
  php:
    # The VPS sets IMAGE to the registry image of the deployed commit; builds keep the local name.
    image: ${IMAGE:-${IMAGES_PREFIX:-}app-php-prod}
    build:
      context: .
      target: frankenphp_prod
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
