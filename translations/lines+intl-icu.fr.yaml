# The lines the characters say, in French: each key is a pool of variants (a list), drawn in turn,
# or a single line (a string). A message is ICU MessageFormat: {name}, {n, plural, ...},
# {kind, select, ...}. Reactions and behaviours name a key; a test checks that it exists in both
# languages (docs/architecture.md, The behaviour engine). A key that ends in a number is only
# valid as a list item (`grab.0`, `grab.1`): `level.2: x` would read as a variant of `level`.
grab:
    - 'Hé ! Tu fais quoi avec ça ?'
    - 'Repose ça.'
    - 'C’était aligné au pixel près.'
    - 'Tu sais combien de temps ça m’a pris ?'
    - 'OK. Je note.'
letter:
    - 'C’est son nom, quand même !'
    - 'Il manque une lettre, là.'
    - 'Rends cette lettre.'
link:
    - 'Ça sert à le contacter, ça. Repose.'
    - 'Ce lien, on en a besoin.'
drop:
    - 'Hé, doucement !'
    - 'Tu paies la casse ?'
    - 'Bravo.'
me:
    - 'Lâche-moi !'
    - 'Je vais me plaindre !'
    - 'Pose-moi. Tout de suite.'
    - 'J’ai le vertige.'
hurt:
    - 'Aïe !'
    - 'Attention aux lunettes !'
    - 'Tu as failli éteindre ma clope.'
run:
    - 'AU SECOURS !'
    - 'ÇA VA PÉTER !'
    - 'Sauve qui peut !'
bombTool:
    - 'C’est quoi, ça ? Non. Non non non.'
    - 'Tu ne vas pas faire ça.'
stormTool:
    - 'Il y a du vent, non ?'
    - 'Ça, ce n’est pas couvert par la garantie.'
float:
    - 'Qui a coupé la gravité ?'
    - 'Remets ça. Je ne plaisante pas.'
back:
    - 'J’arrive ! Personne ne touche à rien.'
    - 'Allez. C’est reparti.'
    - 'Encore ?!'
build:
    - 'Une pièce à la fois…'
    - 'Ça, ça va là.'
    - 'Hop.'
done:
    - 'Voilà. Comme si de rien n’était.'
    - 'Tu sais que je repars de zéro à chaque fois ?'
    - 'Terminé. Et le site n’est jamais tombé.'
    - 'Prêt pour la prochaine bêtise.'
cancel:
    - 'Sérieusement ?! Je venais de finir ça !'
    - 'Mais je TRAVAILLE, là !'
lazyBack:
    - 'Bon… Puisque personne ne le fait.'
    - 'Pfff. Je suppose que c’est encore pour moi.'
    - 'Je vais ranger. Lentement.'
lazy:
    - 'Pfff…'
    - 'Mon dos…'
    - 'Une petite pause clope.'
    - 'Qui a lancé ça si loin ?'
    - 'Je ne suis pas payé assez pour ça.'
    - 'Celle-là, elle peut attendre.'
lazyStop:
    - 'Tu vois ? C’est pour ça que je ne me presse pas.'
    - 'Super. Je laisse comme ça, alors.'
hurry:
    - 'Ah, tu veux que je me dépêche ? D’accord.'
    - 'Oui oui, j’accélère.'
lazyDone:
    - 'Voilà. Personne ne m’a aidé, hein.'
    - 'Fini. Je vais m’asseoir.'
