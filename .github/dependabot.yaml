version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    ignore:
      # Node 25 and later no longer ship Corepack, which runs pnpm: a major bump is a manual change.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    ignore:
      # Shares its major version with the npm vite-plugin-symfony: a major bump is a manual change to both.
      - dependency-name: pentatrion/vite-bundle
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    ignore:
      # Shares its major version with pentatrion/vite-bundle (composer): a major bump is a manual
      # change to both.
      - dependency-name: vite-plugin-symfony
        update-types: ['version-update:semver-major']
      # The types follow the Node major of the Docker image.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript up to 6.0 and needs its JavaScript API, which 7 no
      # longer ships: revisit when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Released together, and each release pins the others.
      typescript-eslint:
        patterns: ['typescript-eslint', '@typescript-eslint/*']
      eslint:
        patterns: ['eslint', '@eslint/*']
