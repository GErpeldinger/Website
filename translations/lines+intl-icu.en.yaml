# The lines the characters say, in English: each key is a pool of variants (a list), drawn in turn,
# or a single line (a string). A message is ICU MessageFormat: {name}, {n, plural, ...},
# {kind, select, ...}. Reactions and behaviours name a key; a test checks that it exists in both
# languages (docs/architecture.md, The behaviour engine). A key that ends in a number is only
# valid as a list item (`grab.0`, `grab.1`): `level.2: x` would read as a variant of `level`.
grab:
    - 'Hey! What are you doing with that?'
    - 'Put that back.'
    - 'That was pixel-perfect.'
    - 'Do you know how long that took me?'
    - 'OK. I’m taking notes.'
letter:
    - 'That’s a person’s name, you know!'
    - 'There’s a letter missing now.'
    - 'Give that letter back.'
link:
    - 'People need that to get in touch. Put it down.'
    - 'We need that link.'
drop:
    - 'Hey, careful!'
    - 'Are you paying for that?'
    - 'Well done.'
me:
    - 'Let go of me!'
    - 'I’m filing a complaint!'
    - 'Put me down. Right now.'
    - 'I’m scared of heights.'
hurt:
    - 'Ouch!'
    - 'Watch the shades!'
    - 'You almost put out my smoke.'
burnt:
    - '*cough* That was my last cigarette.'
    - 'Nice. Now it looks like my lighter blew up in my face.'
backTop:
    - 'I’ve seen the sun up close. It smokes less than I do.'
    - 'Nice view up there. Not a single tobacco shop, though.'
backSide:
    - 'No way out over there. I checked.'
    - 'I’m back. Not for you, for the page.'
run:
    - 'HELP!'
    - 'IT’S GONNA BLOW!'
    - 'Run for it!'
bombTool:
    - 'What’s that? No. No no no.'
    - 'You’re not going to do that.'
stormTool:
    - 'Is it me, or is it windy?'
    - 'That’s not covered by the warranty.'
float:
    - 'Who turned off gravity?'
    - 'Put it back. I’m not joking.'
back:
    - 'Coming! Nobody touch anything.'
    - 'Right. Here we go again.'
    - 'Again?!'
build:
    - 'One piece at a time…'
    - 'This goes here.'
    - 'Hop.'
done:
    - 'There. As if nothing happened.'
    - 'You know I start from scratch every time?'
    - 'Done. And the site never went down.'
    - 'Ready for your next bad idea.'
cancel:
    - 'Seriously?! I just finished that!'
    - 'I’m WORKING here!'
lazyBack:
    - 'Well… since nobody else is doing it.'
    - 'Sigh. I guess it’s on me again.'
    - 'I’ll tidy up. Slowly.'
lazy:
    - 'Sigh…'
    - 'My back…'
    - 'Quick smoke break.'
    - 'Who threw this so far?'
    - 'I don’t get paid enough for this.'
    - 'That one can wait.'
lazyStop:
    - 'See? That’s why I don’t rush.'
    - 'Great. I’ll just leave it like that, then.'
hurry:
    - 'Oh, you want me to hurry? Fine.'
    - 'Yes, yes, speeding up.'
lazyDone:
    - 'There. Nobody helped me, by the way.'
    - 'Done. I’m going to sit down.'
